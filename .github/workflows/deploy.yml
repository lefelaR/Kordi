name: Deploy to kordicraftcreations
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to anissa.aserv.co.za
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: anissa.aserv.co.za
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          server-dir: public_html/
          log-level: verbose
services:
  web:
    build:
      context: .
    ports:
      - "${PORT:-8081}:80"
    volumes:
      - .:/var/www/html
      - ./docker/apache-api-proxy.conf:/etc/apache2/conf-available/api-proxy.conf:ro
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-kordi}
      DB_USER: ${DB_USER:-kordi}
      DB_PASSWORD: ${DB_PASSWORD:-kordi-local-password}
      APP_LOGIN_EMAIL: ${APP_LOGIN_EMAIL:-admin@kordicraftcreations.co.za}
      APP_LOGIN_PASSWORD: ${APP_LOGIN_PASSWORD:-kordicraft-demo}
      API_BASE_URL: ${API_BASE_URL:-http://api:8000/api}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  api:
    build:
      context: ./api
    volumes:
      - ./api:/var/www/html
    environment:
      APP_NAME: KordicraftAPI
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8081/api}
      APP_KEY: ${API_APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_NAME:-kordi}
      DB_USERNAME: ${DB_USER:-kordi}
      DB_PASSWORD: ${DB_PASSWORD:-kordi-local-password}
      APP_LOGIN_EMAIL: ${APP_LOGIN_EMAIL:-admin@kordicraftcreations.co.za}
      APP_LOGIN_PASSWORD: ${APP_LOGIN_PASSWORD:-kordicraft-demo}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-kordi}
      MYSQL_USER: ${DB_USER:-kordi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kordi-local-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-kordi-root-local-password}
    ports:
      - "${DB_PORT_HOST:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
